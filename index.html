<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Browse, search and filter 250 countries. See population, region, capital, currencies, languages and bordering countries, in light or dark mode."
    />
    <title>Where in the world?</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@300;600;800&display=swap"
      rel="stylesheet"
    />
    <script>
      ;(function () {
        var prefersDark = false
        try {
          prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
        } catch (error) {
          prefersDark = false
        }

        var theme = prefersDark ? 'dark' : 'light'
        try {
          var stored = localStorage.getItem('theme')
          if (stored === 'dark' || stored === 'light') theme = stored
        } catch (error) {
          // Storage can throw in private mode; the OS preference above still applies.
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
